apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: sfr-alerts
  labels:
    app: supplier-failure-radar
    release: kube-prometheus-stack   # match this to your Prometheus Operator's ruleSelector label
spec:
  groups:
    - name: supplier-failure-radar.rules
      rules:

        - alert: SupplierPipelineNotRunning
          expr: increase(supplier_prediction_runs_total[30m]) == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Supplier prediction pipeline has not run in 30 minutes"
            description: >
              No increase in supplier_prediction_runs_total over the last 30 minutes.
              Celery Beat or the celery-worker may be down, or the scheduled task is failing silently.

        - alert: SupplierPipelineHighLatency
          expr: histogram_quantile(0.95, sum(rate(supplier_pipeline_duration_seconds_bucket[10m])) by (le)) > 60
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Supplier prediction pipeline is slow (p95 > 60s)"
            description: >
              95th percentile pipeline duration has exceeded 60 seconds over the last 10 minutes.
              Check DB/feature-building performance.

        - alert: SupplierCacheMissRateHigh
          expr: |
            (
              sum(rate(supplier_cache_misses_total[15m]))
              /
              (sum(rate(supplier_cache_hits_total[15m])) + sum(rate(supplier_cache_misses_total[15m])))
            ) > 0.5
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Supplier prediction cache miss rate is above 50%"
            description: >
              Redis cache miss rate has exceeded 50% over 15 minutes. Check Redis connectivity
              and whether the pipeline is caching results correctly.

        - alert: SupplierAPIPodCrashLooping
          expr: increase(kube_pod_container_status_restarts_total{namespace="default", pod=~"sfr-api-.*"}[15m]) > 3
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Supplier Failure Radar API pod is crash-looping"
            description: >
              A sfr-api pod has restarted more than 3 times in the last 15 minutes.

        - alert: SupplierAPIDeploymentReplicasUnavailable
          expr: kube_deployment_status_replicas_available{namespace="default", deployment="sfr-api"} < 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "No available replicas for sfr-api deployment"
            description: >
              The sfr-api Deployment has fewer than 1 available replica for 5 minutes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sfr-api
  labels:
    app: supplier-failure-radar
spec:
  replicas: 2
  selector:
    matchLabels:
      app: supplier-failure-radar
  template:
    metadata:
      labels:
        app: supplier-failure-radar
    spec:
      containers:
        - name: sfr-api
          image: supplier-failure-radar:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: sfr-config
            - secretRef:
                name: sfr-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"